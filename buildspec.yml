version: 0.2

env:
  variables:
    MODEL_NAME: "ml-model"
    SAGEMAKER_ROLE_ARN: "arn:aws:iam::ACCOUNT:role/SageMakerExecutionRole"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt
  pre_build:
    commands:
      - coverage erase
      - pre-commit run --all-files
      - python model/train.py
      - cat README.md
  build:
    commands:
      - coverage run -m pytest
      - coverage report
      - echo "Training and testing ML model..."
      - python model/train.py
      - echo "Deploying to SageMaker..."
      - python sagemaker/deploy.py --model-name $MODEL_NAME --role-arn $SAGEMAKER_ROLE_ARN
      - git log | head -100
      - git status
      - ls
      - git archive --format=zip HEAD > application.zip

artifacts:
  files:
    - application.zip
    - model.tar.gz
